<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Menu - Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="#" class="sidebar-logo"><i class="fas fa-utensils"></i> CanteenIQ Admin</a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link"><i class="fas fa-chart-line"></i> Dashboard</a></li>
        <li><a href="menu.html" class="nav-link active"><i class="fas fa-hamburger"></i> Manage Menu</a></li>
        <li><a href="bookings.html" class="nav-link"><i class="fas fa-ticket-alt"></i> Bookings</a></li>
        <li><a href="waste.html" class="nav-link"><i class="fas fa-trash-alt"></i> Waste Tracker</a></li>
        <li><a href="reports.html" class="nav-link"><i class="fas fa-inbox"></i> Student Reports</a></li>
        <li style="margin-top: auto;"><a href="#" id="logout-btn" class="nav-link text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h2>Menu Management</h2>
        <div class="flex gap-2">
          <button class="btn btn-primary" onclick="document.getElementById('add-modal').classList.add('active')">
            <i class="fas fa-plus"></i> Add Item
          </button>
          <button id="theme-toggle" class="theme-toggle"></button>
        </div>
      </header>

      <div class="card">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="menu-body">
              <tr><td colspan="6" class="text-center"><span class="loader"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Item Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Menu Item</h3>
        <button class="modal-close"><i class="fas fa-times"></i></button>
      </div>
      <form id="add-form">
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="add-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="add-category" class="form-control">
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="snacks">Snacks</option>
          </select>
        </div>
        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="add-price" class="form-control" required min="1">
        </div>
        <div class="form-group">
          <label>Image URL (Optional)</label>
          <input type="url" id="add-image" class="form-control" placeholder="https://...">
        </div>
        <div class="form-group flex items-center gap-2">
          <input type="checkbox" id="add-available" checked>
          <label for="add-available" style="margin:0;">Is Available?</label>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="width:100%">Save Item</button>
      </form>
    </div>
  </div>

  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/ui.js"></script>
  <script type="module">
    import { requireAuth } from '../js/auth.js';
    import { db } from '../js/firebase-config.js';
    import { collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { showToast, closeModal } from '../js/ui.js';

    requireAuth('admin');

    // Load Menu
    onSnapshot(collection(db, 'menuItems'), (snapshot) => {
      const tbody = document.getElementById('menu-body');
      tbody.innerHTML = '';
      snapshot.forEach(docSnap => {
        const item = docSnap.data();
        const id = docSnap.id;
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${item.imageUrl || 'https://via.placeholder.com/50'}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;"></td>
          <td style="font-weight: 500;">${item.name}</td>
          <td>${item.category}</td>
          <td>₹${item.price}</td>
          <td>
            <label class="switch">
              <input type="checkbox" class="toggle-availability" data-id="${id}" ${item.isAvailable ? 'checked' : ''}>
              <span class="slider"></span>
            </label>
            ${item.isAvailable ? '<span class="text-success ml-2" style="font-size:0.8rem">Active</span>' : '<span class="text-danger ml-2" style="font-size:0.8rem">Inactive</span>'}
          </td>
          <td>
            <button class="btn btn-danger btn-sm delete-btn" data-id="${id}"><i class="fas fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Toggle events
      document.querySelectorAll('.toggle-availability').forEach(cb => {
        cb.addEventListener('change', async (e) => {
          const id = e.target.dataset.id;
          try {
             await updateDoc(doc(db, 'menuItems', id), { isAvailable: e.target.checked });
             showToast('Status updated');
          } catch(err) {
             showToast('Error updating status', 'error');
             e.target.checked = !e.target.checked; // revert
          }
        });
      });

      // Delete events
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if(confirm("Delete this item permanently?")) {
            const id = e.target.closest('button').dataset.id;
            await deleteDoc(doc(db, 'menuItems', id));
            showToast('Item deleted');
          }
        });
      });
    });

    // Add Item
    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.innerHTML = '<span class="loader"></span>';
      
      try {
        await addDoc(collection(db, 'menuItems'), {
          name: document.getElementById('add-name').value,
          category: document.getElementById('add-category').value,
          price: parseFloat(document.getElementById('add-price').value),
          imageUrl: document.getElementById('add-image').value,
          isAvailable: document.getElementById('add-available').checked
        });
        showToast('Item added successfully', 'success');
        closeModal('add-modal');
        e.target.reset();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      } finally {
        btn.innerHTML = 'Save Item';
      }
    });
  </script>
  
  <style>
    /* Simple Toggle Switch CSS */
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; vertical-align: middle; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--secondary); }
    input:checked + .slider:before { transform: translateX(14px); }
  </style>
</body>
</html>
