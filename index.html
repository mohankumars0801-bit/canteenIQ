<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanteenIQ - Smart College Canteen System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  
  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="text-center mb-4">
        <h1 style="color: var(--primary); font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 0.5rem;"><i class="fas fa-utensils"></i> CanteenIQ</h1>
        <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-main);">Food Demand Prediction System</div>
        <p class="text-muted mt-1" style="font-size: 0.85rem;">Reduce waste. Skip the queue. Eat fresh.</p>
      </div>

      <!-- Login Section -->
      <div id="login-section">
        <h2 class="mb-4">Welcome Back</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" class="form-control" required placeholder="student@college.edu">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" class="form-control" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        
        <div class="mt-4 mb-2 text-center" style="font-size: 0.85rem; font-weight: bold; color: var(--text-muted);">
          --- OR BYPASS LOGIN ---
        </div>
        <div class="flex gap-2 justify-center">
          <a href="student/index.html" class="btn btn-secondary w-100" style="flex: 1; text-align: center;">Enter as Student</a>
          <a href="admin/index.html" class="btn btn-secondary w-100" style="flex: 1; text-align: center;">Enter as Admin</a>
        </div>

        <p class="text-center mt-4 text-muted">
          Don't have an account? <a href="#" id="show-signup" style="color: var(--primary);">Sign up</a>
        </p>
      </div>

      <!-- Signup Section -->
      <div id="signup-section" class="hidden">
        <h2 class="mb-4">Create Account</h2>
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" name="name" class="form-control" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" class="form-control" required placeholder="student@college.edu">
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" class="form-control" required placeholder="•••••••• (Min 6 chars)" minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
        </form>
        <p class="text-center mt-4 text-muted">
          Already have an account? <a href="#" id="show-login" style="color: var(--primary);">Login</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script>
     // Redirect if already logged in handled by auth state
     import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
     import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
     import { auth, db } from './js/firebase-config.js';
     
     onAuthStateChanged(auth, async (user) => {
       if (user) {
         const userDoc = await getDoc(doc(db, 'users', user.uid));
         if(userDoc.exists()){
            const role = userDoc.data().role;
            if(role === 'admin') window.location.href = './admin/index.html';
            else window.location.href = './student/index.html';
         }
       }
     });
  </script>
</body>
</html>
